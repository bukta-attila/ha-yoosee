name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: Added
    semver-increment: minor
    when:
      conventional:
        type: feat
  - title: Fixed
    when:
      conventional:
        type: fix
  - title: Changed
    when:
      conventional:
        types:
          - refactor
          - perf
change-template: "- $TITLE (#$NUMBER)"
template: |
  $CHANGES
